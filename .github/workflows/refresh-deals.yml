name: Refresh deals
on:
  schedule: [{cron: "17 7 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_deals.py
      - run: |
          git config user.name "pixelsteals-bot"; git config user.email "actions@users.noreply.github.com"
          git add deals.json; git diff --cached --quiet || (git commit -m "Daily deals refresh" && git push)

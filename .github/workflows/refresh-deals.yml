name: Refresh deals
on:
  schedule: [{cron: "17 7 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_deals.py
      - run: python3 scripts/build_pages.py
      - run: |
          git config user.name "pixelsteals-bot"; git config user.email "actions@users.noreply.github.com"
          git add deals.json guides; git diff --cached --quiet || (git commit -m "Daily deals refresh" && git push)
      - name: Email today's deals to confirmed subscribers
        if: vars.SEND_ENABLED == 'true' && github.event_name == 'schedule'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: python3 scripts/send_digest.py
